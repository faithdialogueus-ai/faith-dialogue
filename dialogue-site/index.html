<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialogue</title>
  <meta name="description" content="Christians and Muslims reading the Bible and the Qur’an side by side. Videos and PDFs for each study session.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="masthead__inner">
      <div class="masthead__text">
        <a class="site-name" href="#/" id="site-name">Dialogue</a>
        <p class="site-tagline" id="site-tagline"></p>
      </div>
      <!-- Two traditions, one shared middle: the mark of the site -->
      <svg class="mark" viewBox="0 0 400 260" aria-hidden="true">
        <defs>
          <clipPath id="left-circle"><circle cx="160" cy="130" r="112"/></clipPath>
          <radialGradient id="lens" cx="0.5" cy="0.5" r="0.6">
            <stop offset="0" stop-color="#f3d38c" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#d6ae5b" stop-opacity="0.12"/>
          </radialGradient>
        </defs>
        <circle class="mark__ring mark__ring--b" cx="160" cy="130" r="112"/>
        <circle class="mark__ring mark__ring--q" cx="240" cy="130" r="112"/>
        <circle class="mark__lens" cx="240" cy="130" r="112" clip-path="url(#left-circle)" fill="url(#lens)"/>
      </svg>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer"><p id="footer-text"></p></footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
